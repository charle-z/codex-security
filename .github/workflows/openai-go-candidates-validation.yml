name: openai-go-candidates-validation

on:
  push:
    branches: [validation/openai-go-candidates]

permissions:
  contents: read

jobs:
  lint:
    name: lint / ${{ matrix.candidate }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: issue-425
            sha: de3fe68d3c8e0b131e1272ff52f3dbd2c3903d42
          - candidate: issue-379
            sha: 67c417acee2cdfe3b5f7daeb37327c8b32a0fbf4
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: charle-z/openai-go
          ref: ${{ matrix.sha }}
          path: target
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: target/go.mod

      - name: Run lints
        working-directory: target
        run: ./scripts/lint

      - name: Check go.mod is tidy
        working-directory: target
        run: ./scripts/check-go-mod

  test:
    name: test / ${{ matrix.candidate }} / Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        candidate: [issue-425, issue-379]
        go-version: [1.25.x, 1.26.x]
        include:
          - candidate: issue-425
            sha: de3fe68d3c8e0b131e1272ff52f3dbd2c3903d42
          - candidate: issue-379
            sha: 67c417acee2cdfe3b5f7daeb37327c8b32a0fbf4
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: charle-z/openai-go
          ref: ${{ matrix.sha }}
          path: target
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Bootstrap
        working-directory: target
        env:
          SKIP_BREW: "1"
        run: ./scripts/bootstrap

      - name: Test root module
        working-directory: target
        run: ./scripts/test

      - name: Test examples module
        working-directory: target/examples
        run: go test ./...

      - name: Test external consumer
        working-directory: target/internal/testdata/consumer
        run: go test -mod=readonly ./...
